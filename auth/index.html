<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Manager Dashboard</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- Header Section -->
    <header class="bg-dark text-white p-3 d-flex justify-content-between align-items-center">
        <div class="logo h4 mb-0">Event Manager</div>
        <div class="profile d-flex align-items-center">
            <span class="me-3">Welcome, Admin</span>
            <button class="btn btn-danger" onclick="logout()">Logout</button>
        </div>
    </header>

    <!-- Sidebar Navigation -->
    <div class="container-fluid d-flex">
        <aside class="bg-light p-3" style="width: 250px; height: 100vh;">
            <nav>
                <ul class="list-unstyled">
                    <li><a href="#hall-booking" class="d-block p-2 text-decoration-none">Hall Booking</a></li>
                    <li><a href="#decoration" class="d-block p-2 text-decoration-none">Decoration</a></li>
                    <li><a href="#food" class="d-block p-2 text-decoration-none">Food</a></li>
                    <li><a href="#event-overview" class="d-block p-2 text-decoration-none">Event Overview</a></li>
                </ul>
            </nav>
        </aside>

        <!-- Main Dashboard Content -->
        <main class="container-fluid p-4">
            <!-- Hall Booking Section -->
            <section id="hall-booking">
                <h2>Hall Booking</h2>
                <div class="content mb-3">
                    <button class="btn btn-primary" onclick="bookHall()">Book a Hall</button>
                    <div id="hall-list" class="mt-3"></div>
                </div>
            </section>

            <!-- Decoration Section -->
            <section id="decoration">
                <h2>Decoration</h2>
                <div class="content mb-3">
                    <button class="btn btn-primary" onclick="manageDecorations()">Manage Decorations</button>
                    <div id="decoration-list" class="mt-3"></div>
                </div>
            </section>

            <!-- Food Section -->
            <section id="food">
                <h2>Food</h2>
                <div class="content mb-3">
                    <button class="btn btn-primary" onclick="manageFood()">Manage Food</button>
                    <div id="food-list" class="mt-3"></div>
                </div>
            </section>

            <!-- Event Overview Section -->
            <section id="event-overview">
                <h2>Event Overview</h2>
                <div class="content">
                    <p>Total Events: 5</p>
                    <p>Upcoming Events: 3</p>
                </div>
            </section>
        </main>
    </div>

    <!-- Bootstrap JS and Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
    <script src="../js/script.js"></script>
</body>
</html>
