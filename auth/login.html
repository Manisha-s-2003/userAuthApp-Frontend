<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <style>
      /* Custom Gold Theme */
      body {
        background-color: #f5f5f5; /* Light background for contrast */
        color: #333; /* Dark text for readability */
      }
      .card {
        border: 1px solid #ffd700; /* Gold border for the card */
        box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
      }
      h1 {
        color: #ffd700; /* Gold color for the heading */
      }
      .form-label {
        color: #333; /* Dark color for labels */
      }
      .btn-primary {
        background-color: #ffd700;
        border-color: #ffd700;
        color: #333; /* Dark text for button contrast */
      }
      .btn-primary:hover {
        background-color: #e6c200; /* Slightly darker gold on hover */
        border-color: #e6c200;
      }
      a {
        color: #ffd700; /* Gold color for links */
        text-decoration: none;
      }
      a:hover {
        color: #e6c200; /* Slightly darker gold on hover */
      }
    </style>
  </head>
  <body>
    <div
      class="container d-flex justify-content-center align-items-center vh-100"
    >
      <div class="card p-4" style="width: 24rem">
        <h1 class="text-center mb-4">Login</h1>
        <form id="loginForm">
          <div class="form-group">
            <label for="email" class="form-label text-start d-block"
              >Email Id</label
            >
            <input
              type="email"
              class="form-control"
              id="email"
              placeholder="Email"
              required
            />
          </div>
          <div class="form-group mt-3">
            <label for="password" class="form-label text-start d-block"
              >Password</label
            >
            <input
              type="password"
              class="form-control"
              id="password"
              placeholder="Password"
              required
            />
          </div>
          <button type="submit" class="btn btn-primary w-100 mt-4">
            Login
          </button>
        </form>
        <p class="text-center mt-3">
          Don't have an account? <a href="register.html">Register here</a>
        </p>
      </div>
    </div>
    <script src="../js/auth.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
