<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Services</title>
  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

  <div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4" style="width: 24rem">
        <h1 class="text-center mb-4">Login</h1>
        <form id="eventsdetailsform">
          <div class="form-group">
            <label for="eventType" class="form-label">Event Type</label>
            <select class="form-select" id="eventType" required>
              <option value="" disabled selected>Select Event Type</option>
              <option value="Hall Booking">Hall Booking</option>
              <option value="Decoration">Decoration</option>
              <option value="Food Catering">Food Catering</option>
              <option value="Photography">Photography</option>
            </select>
          </div>
      
      <div class="card-body">
        <!-- Service Selection Form -->
        <form id="servicesForm">
          <div class="mb-3">
            <label for="eventType" class="form-label">Event Type</label>
            <select class="form-select" id="eventType" required>
              <option value="" disabled selected>Select Event Type</option>
              <option value="Hall Booking">Hall Booking</option>
              <option value="Decoration">Decoration</option>
              <option value="Food Catering">Food Catering</option>
              <option value="Photography">Photography</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="additionalServices" class="form-label">Additional Services</label>
            <input
              type="text"
              class="form-control"
              id="additionalServices"
              placeholder="e.g. Special requests, preferences"
              required
            />
          </div>

          <div class="mb-3">
            <label for="eventDate" class="form-label">Event Date</label>
            <input type="date" class="form-control" id="eventDate" required />
          </div>

          <div class="text-center">
            <button type="submit" class="btn btn-warning w-100">Submit</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="container my-5">
    <!-- List of Submitted Services -->
    <h3 class="mt-5 text-center">Submitted Services</h3>
    <div id="serviceList" class="mt-3">
      <!-- Submitted services will appear here -->
    </div>
  </div>

  <!-- Bootstrap JS and Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
  <script>
    // Handle the form submission
    document.getElementById('servicesForm').addEventListener('submit', function (e) {
      e.preventDefault();

      // Get form values
      const eventType = document.getElementById('eventType').value;
      const additionalServices = document.getElementById('additionalServices').value;
      const eventDate = document.getElementById('eventDate').value;

      // Create a new div to display the submitted service
      const serviceItem = document.createElement('div');
      serviceItem.classList.add('border', 'p-3', 'mb-3');
      serviceItem.innerHTML = `
        <h5>${eventType}</h5>
        <p><strong>Date:</strong> ${eventDate}</p>
        <p><strong>Additional Services:</strong> ${additionalServices}</p>
      `;

      // Append to the service list
      document.getElementById('serviceList').appendChild(serviceItem);

      // Clear the form
      document.getElementById('servicesForm').reset();
    });
  </script>
</body>
</html>
