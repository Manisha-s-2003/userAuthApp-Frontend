<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Services</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>

    
    <div
      class="container d-flex justify-content-center align-items-center vh-100"
    >
      <div class="card p-4" style="width: 35rem">
        <h1 class="text-center mb-4">Event Details</h1>
        <form id="eventsdetailsform">
          <h6 id="eventNameDisplay">Loading event...</h6>
          
        

          <!-- Event Services (Checkboxes) -->
          <div class="form-group" style="margin-bottom: 20px;">
            <label class="form-label">Event Services</label>
            <div class="form-check">
              <input type="checkbox" class="form-check-input" id="hallBooking" />
              <label class="form-check-label" for="hallBooking">Hall Booking</label>
            </div>
            <div class="form-check">
              <input type="checkbox" class="form-check-input" id="decoration" />
              <label class="form-check-label" for="decoration">Decoration</label>
            </div>
            <div class="form-check">
              <input type="checkbox" class="form-check-input" id="foodCatering" />
              <label class="form-check-label" for="foodCatering">Food Catering</label>
            </div>
            <div class="form-check">
              <input type="checkbox" class="form-check-input" id="photography" />
              <label class="form-check-label" for="photography">Photography</label>
            </div>
          </div>

          <!-- Additional Services -->
          <div class="form-group" style="margin-bottom: 20px;">
            <label for="additionalServices" class="form-label">Additional Services</label>
            <input
              type="text"
              class="form-control"
              id="additionalServices"
              placeholder="e.g. Special requests, preferences"
              required
            />
          </div>

          <!-- Event Date -->
          <div class="form-group" style="margin-bottom: 20px;">
            <label for="eventDate" class="form-label">Event Date</label>
            <input type="date" class="form-control" id="eventDate" required />
          </div>

          <!-- Event Time -->
          <div class="form-group" style="margin-bottom: 20px;">
            <label for="event-time" class="form-label">Event Time</label>
            <input type="time" class="form-control" id="event-time" required />
          </div>

          <!-- Event Location -->
          <div class="form-group" style="margin-bottom: 20px;">
            <label for="event-location" class="form-label">Event Location</label>
            <input
              type="text"
              class="form-control"
              id="event-location"
              placeholder="Enter location"
              required
            />
          </div>

          <!-- Number of Guests -->
          <div class="form-group" style="margin-bottom: 20px;">
            <label for="guest-count" class="form-label">Number of Guests</label>
            <input
              type="number"
              class="form-control"
              id="guest-count"
              min="1"
              required
            />
          </div>

          <div class="text-center">
            <button type="submit" class="btn btn-warning w-100">Submit</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Bootstrap JS and Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>

    <script>
      // Handle the form submission
      document
        .getElementById("eventsdetailsform")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          // Get form values
          const eventType = document.getElementById("eventType").value;
          const additionalServices =
            document.getElementById("additionalServices").value;
          const eventDate = document.getElementById("eventDate").value;
          const eventTime = document.getElementById("event-time").value;
          const eventLocation = document.getElementById("event-location").value;
          const guestCount = document.getElementById("guest-count").value;

          // Get selected event services
          const selectedServices = [];
          if (document.getElementById("hallBooking").checked) {
            selectedServices.push("Hall Booking");
          }
          if (document.getElementById("decoration").checked) {
            selectedServices.push("Decoration");
          }
          if (document.getElementById("foodCatering").checked) {
            selectedServices.push("Food Catering");
          }
          if (document.getElementById("photography").checked) {
            selectedServices.push("Photography");
          }

          // Store the event services and other details in the console or send them to the server
          console.log({
            eventType,
            selectedServices,
            additionalServices,
            eventDate,
            eventTime,
            eventLocation,
            guestCount,
          });

          // Optionally clear the form
          document.getElementById("eventsdetailsform").reset();
        });

      window.onload = function() {
        // Retrieve the event name from localStorage
        const eventName = localStorage.getItem("selectedEvent");

        // Display the event name on the page if it exists
        if (eventName) {
            document.getElementById("eventNameDisplay").innerText = `Event Type: ${eventName}`;
        } else {
            document.getElementById("eventNameDisplay").innerText = "No event selected.";
        }
      };
    </script>
  </body>
</html>
